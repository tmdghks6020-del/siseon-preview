<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">시선 — 다른 관점이 모이는 곳</title>
  <desc id="desc">서로 다른 시선이 한 쟁점을 함께 바라보는 커뮤니티 브랜드 이미지</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#123d35"/><stop offset="1" stop-color="#1e5a47"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#d7ee83" stop-opacity=".2"/><stop offset="1" stop-color="#d7ee83" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="630" rx="34" fill="url(#bg)"/>
  <circle cx="910" cy="310" r="310" fill="url(#glow)"/>
  <g fill="none" stroke="#dcebdc" stroke-opacity=".27" stroke-width="2">
    <circle cx="910" cy="310" r="212"/><circle cx="910" cy="310" r="157"/><circle cx="910" cy="310" r="100"/>
  </g>
