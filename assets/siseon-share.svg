  <circle cx="760" cy="170" r="9" fill="#d7ee83"/><circle cx="1058" cy="190" r="6" fill="#dcebdc"/><circle cx="770" cy="456" r="6" fill="#dcebdc"/>
  <g font-family="'Noto Sans KR', sans-serif" fill="#f5f7ee">
