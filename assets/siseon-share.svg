    <text x="88" y="330" font-size="112" font-weight="800" letter-spacing="-8">시선</text>
    <text x="94" y="392" font-size="29" font-weight="500" fill="#d7e4d9">서로 다른 생각을 근거와 존중으로 잇습니다.</text>
