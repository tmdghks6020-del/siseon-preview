    <circle cx="30" cy="30" r="7" fill="#123d35"/>
    <text x="78" y="40" font-family="'Noto Sans KR', sans-serif" font-size="23" font-weight="700" fill="#e4eee5">SISEON COMMUNITY</text>
  </g>
